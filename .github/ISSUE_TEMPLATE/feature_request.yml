name: Feature Request
description: Suggest an idea for Zenith
title: "[FEATURE] : "
labels: ["enhancement"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Is your feature request related to a problem? Please describe.
      placeholder: "I'm always frustrated when [...]"
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen and how it should work.
      placeholder: Describe your proposed solution...
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: Describe alternatives considered...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context or sketches about the feature request here.
      placeholder: Add any other context here...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this feature has not been requested yet.
          required: true
        - label: I understand that this feature may take time to be implemented.
          required: true
